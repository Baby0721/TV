name: sync_live1
permissions:
  contents: write
on:
  schedule:
    # UTC 19:00 → 北京时间次日 03:00
    - cron: "0 19 * * *"
    # UTC 02:00 → 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch: # 支持手动运行

jobs:
  sync_live:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整拉取，避免浅克隆git异常

      - name: 创建live目录
        run: mkdir -p live

      - name: 批量下载直播源 & m3u转txt & 追加FM分组
        run: |
          WGET_ARGS="--timeout=15 --retry-connrefused --tries=3 --no-check-certificate"

          # ========== 下载函数：成功且文件非空才覆盖，失败保留旧文件 ==========
          safe_wget() {
            local url="$1"
            local dst="$2"
            local tmp="${dst}.tmp"
            wget $WGET_ARGS -O "$tmp" "$url" || true
            if [ -s "$tmp" ]; then
              mv "$tmp" "$dst"
              echo "✅ $dst 更新成功"
            else
              rm -f "$tmp"
              echo "⚠️ $dst 下载失败，保留原有文件"
            fi
          }

          # 1. lemonTV.m3u
          safe_wget "https://raw.githubusercontent.com/jia070310/lemonTV/refs/heads/main/iptv-fe.m3u" "live/lemonTV.m3u"
          # 2. vbskycn_ipv4.m3u
          safe_wget "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.m3u" "live/vbskycn_ipv4.m3u"
          # 3. aptv iptv.m3u
          safe_wget "https://raw.githubusercontent.com/Kimentanm/aptv/refs/heads/master/m3u/iptv.m3u" "live/aptv.m3u"
          # 4. ioptu migu m3u
          safe_wget "https://raw.githubusercontent.com/ioptu/migu_video/main/migu.m3u" "tmp_ioptu.m3u"
          # 5. buhanzhe webview.txt → live/ysp.txt
          safe_wget "https://github.com/buhanzhe/webSourceM3U8/releases/latest/download/webview.txt" "live/ysp.txt"
          # my.m3u 根目录
          safe_wget "https://iptv.aiga.cc" "my.m3u"

          # ========== 加固：先判断文件存在，再grep，防止ysp.txt不存在直接报错 ==========
          if [ -f live/ysp.txt ]; then
            if ! grep -q "^#genre#FM收音机" live/ysp.txt; then
              cat >> live/ysp.txt <<'EOF'
#genre#FM收音机
103.8,http://ls.qingting.fm/live/4945.m3u8?bitrate=64
500首华语经典,http://ls.qingting.fm/live/3412131.m3u8?bitrate=64
怀集音乐台,http://live.xmcdn.com:80/live/966/64.m3u8
高清音乐台,http://live.xmcdn.com:80/live/1427/64.m3u8
清晨音乐台,http://live.xmcdn.com:80/live/1011/64.m3u8
老歌音乐台,http://live.xmcdn.com:80/live/2628/64.m3u8
亚洲经典音乐台,http://live.xmcdn.com:80/live/1005/64.m3u8
萤火虫电台,http://live.xmcdn.com:80/live/1006/64.m3u8
卷卷猫讲故事,http://live.xmcdn.com:80/live/2690/64.m3u8
厦门音乐广播,http://ls.qingting.fm/live/1739.m3u8
浙江动听,http://ls.qingting.fm/live/4866.m3u8
四川岷江音乐广播,http://ls.qingting.fm/live/1110.m3u8
广东音乐广播,http://ls.qingting.fm/live/1260.m3u8
深圳飞扬音乐台,http://ls.qingting.fm/live/1271.m3u8

北京新闻广播,http://ls.qingting.fm/live/339.m3u8?bitrate=64
北京文艺广播,http://ls.qingting.fm/live/333.m3u8
北京MetroRadio,http://audiolive.rbc.cn:1935/live/fm945/96K/tzwj_video.m3u8
北京城市广播·副中心之声,http://audiolive.rbc.cn:1935/live/fm1073/96K/tzwj_video.m3u8
北京房山经典音乐,http://live.xmcdn.com/live/963/64.m3u8
北京房山电台,http://live.funhillrm.com/3/sd/live.m3u8
北京好音乐,http://ls.qingting.fm/live/2131011.m3u8
北京经典,http://live.funhillrm.com/4/sd/live.m3u8
北京音乐广播,http://live.xmcdn.com/live/95/64.m3u8

CNR 经典音乐,http://ngcdn004.cnr.cn/live/dszs/index.m3u8
CNR 音乐之声,http://ngcdn003.cnr.cn/live/yyzs/index.m3u8
CNR 中国之声,http://ngcdn001.cnr.cn/live/zgzs/index.m3u8

CRI 环球资讯广播 FM90.5,http://sk.cri.cn/905.m3u8
CRI 中文环球广播,http://sk.cri.cn/hyhq.m3u8
CRI 南海之声,http://sk.cri.cn/nhzs.m3u8
CRI Hit FM FM88.7,http://sk.cri.cn/887.m3u8
CRI 轻松调频 FM91.5,http://sk.cri.cn/915.m3u8
CRI NEWS Plus AM846,http://sk.cri.cn/am846.m3u8

中广流行网,http://stream.rcs.revma.com/aw9uqyxy2tzuv
中广新闻网,http://stream.rcs.revma.com/78fm9wyy2tzuv
中广音乐网,http://stream.rcs.revma.com/ks4vsmg3qtzuv

中央中国乡村之声,http://ngcdn017.cnr.cn/live/xczs/index.m3u8
中央ChinaPlus,http://sk.cri.cn/am846.m3u8
中央英语曼听,http://sk.cri.cn/915.m3u8
中央海峡飞虹,http://sk.cri.cn/hxfh.m3u8
EOF
            fi
          else
            echo "⚠️ ysp.txt 不存在，跳过FM追加"
          fi

          # M3U 转 TXT（频道名,url）
          python3 << EOF
          import re
          output = []
          try:
              with open("tmp_ioptu.m3u","r",encoding="utf-8",errors="ignore") as f:
                  lines = f.readlines()
          except Exception:
              lines = []
          name = ""
          for line in lines:
              line = line.strip()
              if line.startswith("#EXTINF"):
                  match = re.search(r',([^,]+)$', line)
                  if match:
                      name = match.group(1).strip()
              elif line and not line.startswith("#"):
                  output.append(f"{name},{line}")
          with open("live/ioptu_migu.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output))
          EOF
          # 转换后判断txt是否为空，空就删掉
          [ ! -s live/ioptu_migu.txt ] && rm -f live/ioptu_migu.txt
          rm -f tmp_ioptu.m3u

      - name: Git提交推送
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "bot@github.com"
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add live/ my.m3u
          # 无变更跳过提交
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ 没有文件变更，跳过提交"
          else
            git commit -m "Update sync_live"
            git push
          fi
